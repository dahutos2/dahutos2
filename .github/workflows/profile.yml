name: Update Profile

on:
  workflow_dispatch:
  push:
    branches: [ main ] # main への push でも実行   
    paths:
        - 'README.md'
        - '.github/workflows/**'
        - '.github/scripts/**'
  schedule:
    - cron: "0 0 * * *" # 毎日午前0時（UTC）に実行

# 同時に 1 ジョブだけ許可
concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:
  update-profile:
    runs-on: ubuntu-latest
    environment: profile-links
    env:
      OWNER: ${{ github.repository_owner }} # ユーザー名
      GH_TOKEN_PRIVATE: ${{ secrets.PROFILE_TOKEN }} # GraphQL 用 PAT
      LAPRAS_ID: ${{ secrets.LAPRAS_ID }} # Secret
      PROFILE_LINKS: ${{ vars.PROFILE_LINKS }} # プロフィールリンク
      WAKA_TIME_SVG_ID: ${{ secrets.WAKA_TIME_SVG_ID }} # WakaTimeSvg
    steps:
      # リポジトリチェックアウト
      - uses: actions/checkout@v4

      - name: LAPRAS Card
        uses: kawamataryo/lapras-card-readme@main
        with:
          SHARE_ID: ${{ env.LAPRAS_ID }}
          LANG: ja
          UPDATE_TIME: "false"
      
      # -------- Sync Main --------
      - name: Sync with remote main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Download stats
        run: curl "https://fabianocouto-readme-stats.vercel.app/api?username=${OWNER}&show_icons=true&include_all_commits=true&count_private=true&theme=github_dark_dimmed&hide=stars&line_height=28&rank_icon=github" -o assets/stats.svg

      - name: Download streak stats
        run: curl "https://fabianocouto-readme-streak-stats.vercel.app/?user=${OWNER}&background=24292f&border=373e47&stroke=373e47&currStreakNum=adbac7&sideNums=adbac7&sideLabels=adbac7&dates=adbac7&ring=539bf5&currStreakLabel=539bf5&fire=539bf5" -o assets/streak-stats.svg

      - name: Download activity graph
        run: curl "https://fabianocouto-activity-graph.vercel.app/graph/?username=${OWNER}&theme=github-dark-dimmed&radius=6&area=true" -o assets/activity-graph.svg

      - name: Download wakatime
        run: curl "https://fabianocouto-readme-stats.vercel.app/api/wakatime?username=${OWNER}&range=all_time&theme=github_dark_dimmed&layout=compact" -o assets/wakatime.svg

      - name: Download top languages
        run: curl "https://fabianocouto-readme-stats.vercel.app/api/top-langs/?username=${OWNER}&layout=compact&langs_count=10&theme=github_dark_dimmed&hide=jupyter%20notebook" -o assets/top-langs.svg      

      # ---------- 軽量 JSON を生成 (ユーザ/Bio/Repo 言語+スター) ----------
      - name: Generate info.json & repos.json
        run: |
          python - <<'PY'
          import json, os, urllib.request, pathlib, math
          owner = os.environ["OWNER"]
          HEAD  = {'Authorization': f"token {os.environ['GH_TOKEN_PRIVATE']}"}

          # ---- User Info ----
          user = json.loads(urllib.request.urlopen(
              urllib.request.Request(f"https://api.github.com/users/{owner}",headers=HEAD)).read())
          pathlib.Path("assets/info.json").write_text(json.dumps({
              "name": user["name"] or owner,
              "bio":  user["bio"]  or "",
              "location": user["location"] or ""
          }, ensure_ascii=False))

          # ---- Repo Stats ----
          repos, page = [], 1
          while True:
              url=f"https://api.github.com/users/{owner}/repos?per_page=100&page={page}"
              data=json.loads(urllib.request.urlopen(
                  urllib.request.Request(url,headers=HEAD)).read())
              if not data: break
              for r in data:
                  repos.append({"language":r["language"] or "Other",
                                "stars":   r["stargazers_count"]})
              page += 1
          pathlib.Path("assets/repos.json").write_text(json.dumps(repos,ensure_ascii=False))
          PY

      # ---------- README 生成 ----------
      - name: Update README
        run: python .github/scripts/update_readme.py

      #---------- Commit & Push ----------
      - name: Commit & Push if Changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 変更があればコミット
          git add README.md assets
          git diff --cached --quiet && exit 0

          git commit -m "docs: auto update"
          git push --force-with-lease