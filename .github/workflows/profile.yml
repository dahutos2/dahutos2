name: Weekly README Update

on:
    schedule:
        - cron: '0 18 * * 0' # UTC 日曜18時＝JST 月曜03時  
    push:
        branches: [ main ] # main への push でも実行
        paths:
            - 'README.md'
            - '.github/workflows/**'
            - '.github/scripts/**'
    workflow_dispatch:

# 同時に 1 ジョブだけ許可
concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:
    update-profile:
      runs-on: ubuntu-latest
      environment: profile-links
      env:
        GH_TOKEN_PRIVATE: ${{ secrets.PROFILE_TOKEN }}   # GraphQL 用 PAT
        LAPRAS_ID:       ${{ secrets.LAPRAS_ID }}        # Secret
        PROFILE_LINKS:   ${{ vars.PROFILE_LINKS }}       # 環境変数
        OWNER: ${{ github.repository_owner }}            # ユーザー名
      steps:
        - uses: actions/checkout@v4

        # ---------- LAPRAS ----------
        - name: LAPRAS Card
          uses: kawamataryo/lapras-card-readme@main
          with:
            SHARE_ID: ${{ env.LAPRAS_ID }}
            LANG: ja
            UPDATE_TIME: "false"
        
        # -------- Sync Main --------
        - name: Sync with remote main
          run: |
            git fetch origin main
            git reset --hard origin/main

        # ---------- README 生成 ----------
        - name: Update README sections
          run: python .github/scripts/update_readme.py

        #---------- Commit & Push ----------
        - name: Commit & Push if Changed
          run: |
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # 変更があればコミット
            git add README.md
            git diff --cached --quiet && exit 0

            git commit -m "docs: auto update"
            git push --force-with-lease
