name: Weekly README Update

on:
    schedule:
        - cron: '0 18 * * 0' # UTC 日曜18時＝JST 月曜03時  
    push:
        branches: [ main ] # main への push でも実行
        paths:
            - 'README.md'
            - '.github/workflows/**'
            - '.github/scripts/**'
    workflow_dispatch:

jobs:
    update-profile:
      if: github.actor != 'github-actions[bot]'
      runs-on: ubuntu-latest
      environment: profile-links
      env:
        GH_TOKEN_PRIVATE: ${{ secrets.PROFILE_TOKEN }}   # GraphQL 用 PAT
        LAPRAS_ID:       ${{ secrets.LAPRAS_ID }}        # Secret
        PROFILE_LINKS:   ${{ vars.PROFILE_LINKS }}       # 環境変数
        OWNER: ${{ github.repository_owner }}            # ユーザー名
      steps:
        - uses: actions/checkout@v4

        # ---------- 外部 SVG をキャッシュ ----------
        - name: GitHub Readme Stats
          run: |
            mkdir -p .cache
            curl -sSL "https://github-readme-stats.vercel.app/api?username=${{ env.OWNER }}&show_icons=true&count_private=true&hide_border=true" > .cache/stats.svg
            curl -sSL "https://github-readme-stats.vercel.app/api/top-langs/?username=${{ env.OWNER }}&layout=compact&hide_border=true" > .cache/langs.svg
        
        # ---------- Trophy SVG----------
        - name: Fetch Trophy SVG
          run: |
            mkdir -p .cache
            curl -fSL "https://github-profile-trophy.vercel.app/?username=${{ env.OWNER }}" \
            -o .cache/trophy.svg \
            || echo "<svg><!-- trophy fetch failed --></svg>" > .cache/trophy.svg

        # ---------- LAPRAS ----------
        - name: LAPRAS Card
          uses: kawamataryo/lapras-card-readme@main
          with:
            SHARE_ID: ${{ env.LAPRAS_ID }}
            LANG: ja

        # ---------- README 生成 ----------
        - name: Update README sections
          run: python .github/scripts/update_readme.py

        #---------- Commit & Push ----------
        - name: Commit & Push if Changed
          run: |
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # 変更があればコミット
            git add README.md .cache
            git diff --cached --quiet || git commit -m "docs: auto update"

            # push。失敗時（同時実行衝突）は --force-with-lease でリトライ
            git push || git push --force-with-lease
