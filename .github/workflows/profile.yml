name: Update Profile

on:
  workflow_dispatch:
  push:
    branches: [ main ] # main への push でも実行   
    paths:
        - 'README.md'
        - '.github/workflows/**'
        - '.github/scripts/**'
  schedule:
    - cron: "0 0 * * *" # 毎日午前0時（UTC）に実行

# 同時に 1 ジョブだけ許可
concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:
  update-profile:
    runs-on: ubuntu-latest
    environment: profile-links
    env:
      OWNER: ${{ github.repository_owner }} # ユーザー名
      GH_TOKEN_PRIVATE: ${{ secrets.PROFILE_TOKEN }} # GraphQL 用 PAT
      LAPRAS_ID: ${{ secrets.LAPRAS_ID }} # Secret
      PROFILE_LINKS: ${{ vars.PROFILE_LINKS }} # プロフィールリンク
      WAKA_TIME_SVG_ID: ${{ secrets.WAKA_TIME_SVG_ID }} # WakaTimeSvg
    steps:
      # リポジトリチェックアウト
      - uses: actions/checkout@v4

      - name: LAPRAS Card
        uses: kawamataryo/lapras-card-readme@main
        with:
          SHARE_ID: ${{ env.LAPRAS_ID }}
          LANG: ja
          UPDATE_TIME: "false"
      
      # -------- Sync Main --------
      - name: Sync with remote main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Download stats
        run: curl "https://github-readme-stats.vercel.app/api?username=${OWNER}&show_icons=true&include_all_commits=true&count_private=true&theme=github_dark_dimmed" -o assets/stats.svg

      - name: Download streak stats
        run: curl "https://streak-stats.demolab.com?user=${OWNER}&theme=github-dark-dimmed&hide_border=true" -o assets/streak-stats.svg

      - name: Download activity graph
        run: curl "https://github-readme-activity-graph.vercel.app/graph?username=${OWNER}&theme=github-dark-dimmed&area=true&radius=6" -o assets/activity-graph.svg

      - name: Download wakatime
        run: curl "https://github-readme-stats.vercel.app/api/wakatime?username=${OWNER}&range=all_time&theme=github_dark_dimmed&layout=compact" -o assets/wakatime.svg

      - name: Download top languages
        run: curl "https://github-readme-stats.vercel.app/api/top-langs?username=${OWNER}&layout=compact&langs_count=10&theme=github_dark_dimmed&hide=jupyter%20notebook" -o assets/top-langs.svg

      - name: Download trophy
        run: curl curl "https://github-profile-trophy.vercel.app/?username=${OWNER}&theme=dark_dimmed&margin-w=15&margin-h=15&no-bg=true&no-frame=true" -o assets/trophy.svg

      # ---------- 軽量 JSON を生成 (ユーザ/Bio/Repo 言語+スター) ----------
      - name: Generate info.json & repos.json
        run: |
          python - <<'PY'
          import json, os, urllib.request, pathlib, time
          owner = os.environ["OWNER"]
          HEAD  = {'Authorization': f"token {os.environ['GH_TOKEN_PRIVATE']}"}

          # ---- User Info ----
          user = json.loads(urllib.request.urlopen(
              urllib.request.Request(f"https://api.github.com/users/{owner}",headers=HEAD)).read())
          pathlib.Path("assets/info.json").write_text(json.dumps({
              "name": user["name"] or owner,
              "bio":  user["bio"]  or "",
              "location": user["location"] or ""
          }, ensure_ascii=False))

          # ---- Repo Stats ----
          lang_bytes = {}
          page = 1
          while True:
              url=f"https://api.github.com/users/{owner}/repos?per_page=100&page={page}"
              repos=json.loads(urllib.request.urlopen(
                  urllib.request.Request(url,headers=HEAD)).read())
              if not repos: break
              for r in repos:
                  if r["fork"]: # フォークは除外
                      continue
                  # languages_url 内で言語バイトを取得
                  langs=json.loads(urllib.request.urlopen(
                      urllib.request.Request(r["languages_url"],headers=HEAD)).read())
                  for lang, b in langs.items():
                      lang_bytes[lang] = lang_bytes.get(lang, 0) + b
              page += 1
              time.sleep(0.5) # レート制限緩和
          # [{language, bytes}] 形式で保存
          data=[{"language":l,"bytes":b} for l,b in lang_bytes.items()]
          pathlib.Path("assets/repos.json").write_text(json.dumps(data,ensure_ascii=False))
          PY

      # ---------- README 生成 ----------
      - name: Update README
        run: python .github/scripts/update_readme.py

      #---------- Commit & Push ----------
      - name: Commit & Push if Changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 変更があればコミット
          git add README.md assets
          git diff --cached --quiet && exit 0

          git commit -m "docs: auto update"
          git push --force-with-lease