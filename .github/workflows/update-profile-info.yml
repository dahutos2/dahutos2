name: Update Profile Info

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/update-profile-info.yml'
      - '.github/scripts/generate_assets.py'
      - '.github/scripts/update_readme.py'
  schedule:
    - cron: "0 0 * * 0"  # 毎週日曜 (UTC)

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }} # ユーザー名
      GH_TOKEN_PRIVATE: ${{ secrets.PROFILE_TOKEN }} # GraphQL 用 PAT
      LAPRAS_ID: ${{ secrets.LAPRAS_ID }} # Secret
      PROFILE_LINKS: ${{ vars.PROFILE_LINKS }} # プロフィールリンク
      WAKA_TIME_SVG_ID: ${{ secrets.WAKA_TIME_SVG_ID }} # WakaTimeSvg
    steps:
      - uses: actions/checkout@v4
      
      - name: Load versions from .tool-versions
        id: versions
        run: |
          set -euo pipefail

          NODE_VERSION=$(awk '$1=="nodejs" {print $2; exit}' .tool-versions)
          PNPM_VERSION=$(awk '$1=="pnpm" {print $2; exit}' .tool-versions)

          # .tool-versions の欠落を早期に明示して、setup-node/corepack の不透明な失敗を避ける。
          if [ -z "$NODE_VERSION" ] || [ -z "$PNPM_VERSION" ]; then
            echo "::error::.tool-versions must define both nodejs and pnpm versions"
            exit 1
          fi

          echo "node-version=${NODE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "pnpm-version=${PNPM_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node-version }}

      - name: Activate pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@${{ steps.versions.outputs.pnpm-version }} --activate

      - name: Generate info.json & repos.json
        run: python .github/scripts/generate_assets.py
      
      - name: Update README
        run: python .github/scripts/update_readme.py
      
      - name: Set Git Config
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
      - name: Commit & Push if Changed
        run: |
          set -euo pipefail
          git add README.md assets
          git diff --cached --quiet && exit 0
          git commit -m "docs: auto update (info)"
          git push
